<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Lookup Portal</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
            padding: 32px;
            border: 1px solid #e2e8f0;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        select:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 24px;
            text-align: center;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .error-message {
            font-size: 0.8rem;
            color: #dc2626;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Grade Lookup Portal</h2>
            <div class="subtitle">Select your academic term and subject</div>

            <!-- 1. School Year Selection -->
            <div class="form-group">
                <label for="schoolYear">School Year</label>
                <select id="schoolYear" onchange="updateSemesters()">
                    <option value="" disabled selected>-- Select School Year --</option>
                    <option value="2025-2026">2025 – 2026</option>
                    <option value="2026-2027">2026 – 2027</option>
                </select>
            </div>

            <!-- 2. Semester Selection -->
            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" onchange="updateSubjects()" disabled>
                    <option value="" disabled selected>-- Select Semester first --</option>
                    <option value="1st">1st Semester</option>
                    <option value="2nd">2nd Semester</option>
                </select>
            </div>

            <!-- 3. Subject Selection -->
            <div class="form-group">
                <label for="subject">Subject / Course</label>
                <select id="subject" onchange="validateSelection()" disabled>
                    <option value="" disabled selected>-- Select Subject first --</option>
                </select>
                <div id="errorMsg" class="error-message">Please make a complete selection.</div>
            </div>

            <!-- Submit Button -->
            <button id="lookupBtn" class="btn" onclick="redirectToGradePage()" disabled>Look Up Grades</button>
        </div>
    </div>

    <script>
        // Database mapping of subjects available per semester/year
        // You can customize these target HTML filenames (e.g., 'hydraulics_grades.html')
        const subjectData = {
            "2025-2026": {
                "1st": [
                    { name: "Fluid Mechanics", file: "fluid_mechanics_2025_1.html" },
                    { name: "Engineering Economy", file: "eng_economy_2025_1.html" }
                ],
                "2nd": [
                    { name: "Open Channel Hydraulics", file: "open_channel_2025_2.html" },
                    { name: "Structural Engineering", file: "structural_2025_2.html" }
                ]
            },
            "2026-2027": {
                "1st": [
                    { name: "Hydraulics", file: "hydraulics_2026_1.html" },
                    { name: "Surveying", file: "surveying_2026_1.html" }
                ],
                "2nd": [
                    { name: "Advanced Fluid Mechanics", file: "adv_fluid_2026_2.html" },
                    { name: "Foundation Engineering", file: "foundation_2026_2.html" }
                ]
            }
        };

        function updateSemesters() {
            const yearSelect = document.getElementById("schoolYear");
            const semSelect = document.getElementById("semester");
            const subjectSelect = document.getElementById("subject");
            const lookupBtn = document.getElementById("lookupBtn");

            // Reset downstream dropdowns
            semSelect.value = "";
            semSelect.disabled = false;
            
            subjectSelect.innerHTML = '<option value="" disabled selected>-- Select Semester first --</option>';
            subjectSelect.disabled = true;
            
            lookupBtn.disabled = true;
            document.getElementById("errorMsg").style.display = "none";
        }

        function updateSubjects() {
            const yearSelect = document.getElementById("schoolYear").value;
            const semSelect = document.getElementById("semester").value;
            const subjectSelect = document.getElementById("subject");
            const lookupBtn = document.getElementById("lookupBtn");

            subjectSelect.innerHTML = '<option value="" disabled selected>-- Select Subject --</option>';
            
            if (yearSelect && semSelect && subjectData[yearSelect] && subjectData[yearSelect][semSelect]) {
                const subjects = subjectData[yearSelect][semSelect];
                subjects.forEach(sub => {
                    const option = document.createElement("option");
                    option.value = sub.file; // The target HTML file link
                    option.textContent = sub.name;
                    subjectSelect.appendChild(option);
                });
                subjectSelect.disabled = false;
            } else {
                subjectSelect.disabled = true;
            }

            lookupBtn.disabled = true;
        }

        function validateSelection() {
            const subjectSelect = document.getElementById("subject").value;
            const lookupBtn = document.getElementById("lookupBtn");
            const errorMsg = document.getElementById("errorMsg");

            if (subjectSelect) {
                lookupBtn.disabled = false;
                errorMsg.style.display = "none";
            } else {
                lookupBtn.disabled = true;
            }
        }

        function redirectToGradePage() {
            const subjectSelect = document.getElementById("subject");
            const targetFile = subjectSelect.value;

            if (targetFile) {
                // Redirects to your custom linked HTML file
                window.location.href = targetFile;
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }
    </script>
</body>
</html>
